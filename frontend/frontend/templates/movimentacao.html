<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Movimentação de Estoque</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='movimentacao.css') }}">
</head>

<body>

<button class="btn-voltar" onclick="history.back()">← Voltar</button>

<div class="fundo">
    <div class="card-grande">

        <!-- LADO ESQUERDO -->
        <div class="container">

            <div class="titulo">
                <img src="{{ url_for('static', filename='imagens/icone-estoque.jpg') }}">
                <h2>Registrar Movimentação</h2>
            </div>

            <!-- PRODUTO -->
            <label>Produto</label>
            <select id="selecionarProduto" onchange="trocarProduto()"></select>

            <!-- TIPO -->
            <label>Tipo de Movimentação</label>

            <div class="tipo">
                <button type="button" id="entrada" onclick="selecionarTipo('entrada')">
                    Entrada
                </button>

                <button type="button" id="saida" onclick="selecionarTipo('saida')">
                    Saída
                </button>
            </div>

            <!-- QUANTIDADE -->
            <label>Quantidade</label>
            <input type="number" id="quantidade" placeholder="Ex: 10">

            <!-- BOTÃO -->
            <button class="registrar" onclick="registrar()">
                REGISTRAR MOVIMENTAÇÃO
            </button>

            <!-- ALERTA -->
            <div class="alerta-azul">
                <img
                    src="https://cdn-icons-png.flaticon.com/512/471/471663.png"
                    width="18"
                    style="margin-right:10px;"
                >

                <span>
                    <strong>Atenção:</strong>
                    Para saída será verificado se há estoque suficiente.
                </span>
            </div>

            <p id="mensagem"></p>

            <!-- HISTÓRICO -->
            <div class="card">

                <h3>Histórico de movimentação</h3>

                <div class="form">

                    <select id="produtoFiltro">
                        <option value="">Todos</option>
                    </select>

                    <select id="tipoFiltro">
                        <option value="">Todos</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>

                    <input
                        type="number"
                        id="quantidadeFiltro"
                        placeholder="Qtd"
                    >

                    <button type="button" onclick="carregarHistorico()">
                        Atualizar
                    </button>

                </div>

                <table>

                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Produto</th>
                            <th>Tipo</th>
                            <th>Qtd</th>
                        </tr>
                    </thead>

                    <tbody id="tabela"></tbody>

                </table>

            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="card-estoque">

            <div class="titulo-estoque">
                <span class="icone">📦</span>
                <h3>ESTOQUE ATUAL</h3>
            </div>

            <div class="box-estoque">

                <!-- NOME -->
                <h2 id="nomeProduto">PRODUTO</h2>

                <!-- CÓDIGO -->
                <p>
                    Código:
                    <span id="codigoProduto">---</span>
                </p>

                <div class="info-estoque">

                    <!-- ESTOQUE -->
                    <div>
                        <p>Quantidade Atual</p>
                        <h1 id="estoqueAtual">0</h1>
                    </div>

                    <!-- ESTOQUE MINIMO -->
                    <div>
                        <p>Estoque Mínimo</p>
                        <h1 id="estoqueMinimo">0</h1>
                    </div>

                </div>

            </div>

            <!-- ALERTA -->
            <div class="alerta-amarelo" id="alertaEstoque">
                Estoque carregado
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='movimentacao.js') }}"></script>

</body>
</html>
